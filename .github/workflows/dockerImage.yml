name: Docker Image

on:
  # 使用独立标签前缀，避免与 release.yml 的 v* 标签（全平台打包）冲突
  push:
    tags:
      - "image-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析镜像地址与标签
        id: meta
        run: |
          ghcrImage="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "ghcr=${ghcrImage}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 服务器为 ARM 架构时改为 linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.ghcr }}:latest
            ${{ steps.meta.outputs.ghcr }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
